<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">One order in three representations</title><desc id="desc">Representation affects parsing; CSV does not provide native types or a relational constraint system.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">One order in three representations</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. CSV row</text><text x="90" y="140" font-size="17" fill="#183153">OrderID,Region,Quantity → O1,North,3</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. JSON record</text><text x="90" y="265" font-size="17" fill="#183153">{&quot;OrderID&quot;:&quot;O1&quot;,&quot;customer&quot;:{&quot;region&quot;:&quot;North&quot;},&quot;Quantity&quot;:3}</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Relational tables</text><text x="90" y="390" font-size="17" fill="#183153">Orders: O1, CustomerKey=7, Quantity=3; Customers: 7, North</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#0f766e">4. Acquisition checks</text><text x="90" y="515" font-size="17" fill="#183153">Confirm schema, types, encoding, grain, permissions, and provenance.</text><text x="40" y="665" font-size="16" fill="#183153">Representation affects parsing; CSV does not provide native types or a relational</text><text x="40" y="687" font-size="16" fill="#183153">constraint system.</text></g></svg>
