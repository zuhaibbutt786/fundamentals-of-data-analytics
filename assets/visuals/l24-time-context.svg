<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img" aria-labelledby="title desc"><title id="title">Date sets control time intelligence</title><desc id="desc">Classic date-column patterns require a suitable calendar and relationship. A missing prior-year fact period may correctly return BLANK.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">Date sets control time intelligence</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Current selection</text><text x="90" y="140" font-size="17" fill="#183153">February 2024: February 1–29, within the complete 2022–2024 calendar.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Year to date</text><text x="90" y="265" font-size="17" fill="#183153">January 1–February 29, 2024; other dimension filters remain.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Prior-year period</text><text x="90" y="390" font-size="17" fill="#183153">February 2023 for a February-2024 comparison; document leap-day semantics.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#183153">4. Full-history cumulative</text><text x="90" y="515" font-size="17" fill="#183153">All calendar dates up to the selected cutoff; remove the whole DimDate context.</text><path d="M435,556 L435,583" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="585" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="613" font-size="20" font-weight="bold" fill="#0f766e">5. Selected-window cumulative</text><text x="90" y="640" font-size="17" fill="#183153">Only selected dates up to the cutoff; use ALLSELECTED and explain the window.</text><text x="40" y="790" font-size="16" fill="#183153">Classic date-column patterns require a suitable calendar and relationship. A missing</text><text x="40" y="812" font-size="16" fill="#183153">prior-year fact period may correctly return BLANK.</text></g></svg>
