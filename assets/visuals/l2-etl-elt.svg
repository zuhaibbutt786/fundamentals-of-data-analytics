<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">ETL versus ELT</title><desc id="desc">Same source and target. ETL transforms in staging before loading; ELT loads raw data then transforms inside the warehouse.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="35" y="45" font-size="28" font-weight="bold" fill="#183153">ETL versus ELT: where transformation happens</text><rect x="250" y="80" width="500" height="70" rx="9" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="110" text-anchor="middle" font-size="18" fill="#2563eb">SAME SOURCE</text><text x="500.0" y="134" text-anchor="middle" font-size="18" fill="#2563eb">Retail operational database</text><text x="240" y="205" font-size="25" font-weight="bold" text-anchor="middle" fill="#183153">ETL</text><rect x="40" y="230" width="400" height="70" rx="9" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="260" text-anchor="middle" font-size="18" fill="#2563eb">Extract</text><path d="M500,150 L240,230" stroke="#183153" fill="none" stroke-width="2" marker-end="url(#arr)"/><text x="735" y="205" font-size="25" font-weight="bold" text-anchor="middle" fill="#183153">ELT</text><rect x="535" y="230" width="400" height="70" rx="9" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="735.0" y="260" text-anchor="middle" font-size="18" fill="#2563eb">Extract</text><path d="M500,150 L735,230" stroke="#183153" fill="none" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="365" width="400" height="95" rx="9" fill="#f3f7fb" stroke="#b7791f" stroke-width="2"/><text x="240.0" y="395" text-anchor="middle" font-size="18" fill="#b7791f">Transform + validate in staging</text><text x="240.0" y="419" text-anchor="middle" font-size="18" fill="#b7791f">OUTSIDE the target</text><path d="M240,300 L240,365" stroke="#183153" fill="none" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="525" width="440" height="190" fill="#f0fdfa" stroke="#0f766e" stroke-dasharray="5 4"/><text x="45" y="555" font-size="17" fill="#183153">TARGET: analytics warehouse</text><rect x="40" y="585" width="400" height="80" rx="9" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="240.0" y="615" text-anchor="middle" font-size="18" fill="#0f766e">Load curated data</text><path d="M240,460 L240,585" stroke="#183153" fill="none" stroke-width="2" marker-end="url(#arr)"/><rect x="515" y="330" width="440" height="385" fill="#f0fdfa" stroke="#0f766e" stroke-dasharray="5 4"/><text x="540" y="360" font-size="17" fill="#183153">TARGET: analytics warehouse</text><rect x="535" y="390" width="400" height="80" rx="9" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="735.0" y="420" text-anchor="middle" font-size="18" fill="#2563eb">Load raw data</text><path d="M735,300 L735,390" stroke="#183153" fill="none" stroke-width="2" marker-end="url(#arr)"/><rect x="535" y="550" width="400" height="95" rx="9" fill="#f3f7fb" stroke="#b7791f" stroke-width="2"/><text x="735.0" y="580" text-anchor="middle" font-size="18" fill="#b7791f">Transform + validate</text><text x="735.0" y="604" text-anchor="middle" font-size="18" fill="#b7791f">INSIDE the target</text><path d="M735,470 L735,550" stroke="#183153" fill="none" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="785" width="895" height="160" rx="9" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="487.5" y="815" text-anchor="middle" font-size="18" fill="#183153">Both require governance, validation, access control and lineage.</text><text x="487.5" y="839" text-anchor="middle" font-size="18" fill="#183153">Both can retain raw history under a retention policy:</text><text x="487.5" y="863" text-anchor="middle" font-size="18" fill="#183153">ETL can archive extracts; ELT can retain raw landing tables.</text><text x="487.5" y="887" text-anchor="middle" font-size="18" fill="#183153">Choose by constraints, cost, privacy and workload.</text><text x="40" y="990" font-size="18" fill="#183153">Amber + location labels: transformation. Dashed boundary: target environment.</text><text x="40" y="1020" font-size="18" fill="#183153">Solid arrows: data flow. Neither approach is always superior.</text></g></svg>
