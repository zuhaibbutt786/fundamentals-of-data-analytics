<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">One question, four analytical approaches</title><desc id="desc">Illustrative retail scenario. Observational diagnostics alone do not establish causation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">One question, four analytical approaches</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Descriptive: what happened?</text><text x="90" y="140" font-size="17" fill="#183153">Orders fell from 1000 to 800: a 20% decrease.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Diagnostic: what is associated with the change?</text><text x="90" y="265" font-size="17" fill="#183153">Compare device, region, traffic, and checkout changes; investigate alternatives.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Predictive: what might happen?</text><text x="90" y="390" font-size="17" fill="#183153">Estimate future orders with a validated model and uncertainty.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#0f766e">4. Prescriptive: what should we do?</text><text x="90" y="515" font-size="17" fill="#183153">Choose an intervention subject to budget, risk, and an evaluation plan.</text><text x="40" y="665" font-size="16" fill="#183153">Illustrative retail scenario. Observational diagnostics alone do not establish causation.</text></g></svg>
