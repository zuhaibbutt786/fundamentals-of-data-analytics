<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img" aria-labelledby="title desc"><title id="title">Row context and filter context</title><desc id="desc">Synthetic example. COUNTROWS measures lines; DISTINCTCOUNT(OrderID) measures orders.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">Row context and filter context</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Four lines, three orders</text><text x="90" y="140" font-size="17" fill="#183153">North: O1/L1=100, O1/L2=50. South: O2/L1=200, O3/L1=150 USD.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Row-level calculation</text><text x="90" y="265" font-size="17" fill="#183153">Quantity × UnitPrice × (1 − Discount) evaluates a value for each line.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. No region filter</text><text x="90" y="390" font-size="17" fill="#183153">Total=500; Line Count=4; Order Count=3; AOV=500/3 USD.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#183153">4. North filter context</text><text x="90" y="515" font-size="17" fill="#183153">Total=150; Line Count=2; Order Count=1; AOV=150 USD.</text><path d="M435,556 L435,583" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="585" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="613" font-size="20" font-weight="bold" fill="#0f766e">5. Context transition</text><text x="90" y="640" font-size="17" fill="#183153">CALCULATE can convert row context into filter context; use keys to identify rows.</text><text x="40" y="790" font-size="16" fill="#183153">Synthetic example. COUNTROWS measures lines; DISTINCTCOUNT(OrderID) measures orders.</text></g></svg>
