<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 990" role="img" aria-labelledby="title desc"><title id="title">Choose the question before the test</title><desc id="desc">A normality test alone does not choose the method. The design and estimand determine interpretation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">Choose the question before the test</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Independent numerical groups</text><text x="90" y="140" font-size="17" fill="#183153">Mean difference: Welch t-test for two; ANOVA/Welch ANOVA for three or more.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Paired numerical observations</text><text x="90" y="265" font-size="17" fill="#183153">Paired t-test on differences; Wilcoxon signed-rank needs suitable symmetry.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Rank / distribution comparison</text><text x="90" y="390" font-size="17" fill="#183153">Mann–Whitney U or Kruskal–Wallis; not general tests of means.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#183153">4. Categorical association</text><text x="90" y="515" font-size="17" fill="#183153">Chi-square: check expected counts; sparse 2×2 tables may use Fisher exact.</text><path d="M435,556 L435,583" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="585" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="613" font-size="20" font-weight="bold" fill="#183153">5. Numerical association</text><text x="90" y="640" font-size="17" fill="#183153">Pearson for linear; Spearman for monotonic ranks. Plot first.</text><path d="M435,681 L435,708" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="710" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="738" font-size="20" font-weight="bold" fill="#0f766e">6. Report and qualify</text><text x="90" y="765" font-size="17" fill="#183153">Independence, assumptions, effect size, confidence interval, p-value, multiplicity.</text><text x="40" y="915" font-size="16" fill="#183153">A normality test alone does not choose the method. The design and estimand determine</text><text x="40" y="937" font-size="16" fill="#183153">interpretation.</text></g></svg>
