<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img" aria-labelledby="title desc"><title id="title">Dashboard project acceptance criteria</title><desc id="desc">The bundled interactive HTML report demonstrates concepts; a Power BI submission still requires a .pbix built in Desktop.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">Dashboard project acceptance criteria</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Frame</text><text x="90" y="140" font-size="17" fill="#183153">Specify one decision, KPI formulas, grain, units and time scope.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Build</text><text x="90" y="265" font-size="17" fill="#183153">Load star tables, define measures, and test known reference totals.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Interact</text><text x="90" y="390" font-size="17" fill="#183153">Test year and region filters, reset, detail views, and no-data states.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#183153">4. Optimize</text><text x="90" y="515" font-size="17" fill="#183153">Measure performance; simplify only with verified correctness.</text><path d="M435,556 L435,583" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="585" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="613" font-size="20" font-weight="bold" fill="#0f766e">5. Submit</text><text x="90" y="640" font-size="17" fill="#183153">Model/report, data dictionary, QA notes, limitations, and screenshots.</text><text x="40" y="790" font-size="16" fill="#183153">The bundled interactive HTML report demonstrates concepts; a Power BI submission still</text><text x="40" y="812" font-size="16" fill="#183153">requires a .pbix built in Desktop.</text></g></svg>
