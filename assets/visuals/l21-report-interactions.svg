<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img" aria-labelledby="title desc"><title id="title">Report interactions have distinct purposes</title><desc id="desc">A report and a Power BI Service dashboard are different objects. The bundled HTML report is a teaching implementation, not Power BI UI.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">Report interactions have distinct purposes</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Year / region slicers</text><text x="90" y="140" font-size="17" fill="#183153">Set filter context for cards, trend, and region comparison.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Cross-filter / cross-highlight</text><text x="90" y="265" font-size="17" fill="#183153">Choose whether clicking a visual filters or highlights another.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Drillthrough</text><text x="90" y="390" font-size="17" fill="#183153">Open a detail page with the selected entity filter.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#183153">4. Publish and refresh</text><text x="90" y="515" font-size="17" fill="#183153">Use an authorized workspace, appropriate sharing permissions, and scheduled refresh.</text><path d="M435,556 L435,583" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="585" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="613" font-size="20" font-weight="bold" fill="#0f766e">5. Access control</text><text x="90" y="640" font-size="17" fill="#183153">Use roles and row-level security where needed; verify as each viewer.</text><text x="40" y="790" font-size="16" fill="#183153">A report and a Power BI Service dashboard are different objects. The bundled HTML report</text><text x="40" y="812" font-size="16" fill="#183153">is a teaching implementation, not Power BI UI.</text></g></svg>
