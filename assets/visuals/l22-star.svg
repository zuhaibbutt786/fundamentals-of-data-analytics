<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 850"><title>Order-line star schema</title><desc>Unique dimension keys filter Sales through one-to-many relationships; Sales grain is one order line.</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#183153">Star schema: one row per order line</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#183153"/></marker></defs><rect x="330" y="300" width="290" height="220" fill="#eef2f7" stroke="#183153"/><text x="345" y="330" font-size="22" fill="#183153">Sales</text><text x="345" y="362" font-size="16" fill="#183153">OrderID + LineID (grain)</text><text x="345" y="392" font-size="16" fill="#183153">OrderDate / ProductKey</text><text x="345" y="422" font-size="16" fill="#183153">CustomerKey / RegionKey</text><text x="345" y="452" font-size="16" fill="#183153">Quantity / NetRevenue / Profit</text><rect x="330" y="90" width="290" height="120" fill="#eef2f7" stroke="#183153"/><text x="345" y="120" font-size="22" fill="#183153">DimDate</text><text x="345" y="152" font-size="16" fill="#183153">Date (unique)</text><text x="345" y="182" font-size="16" fill="#183153">Year / Month / Quarter</text><rect x="20" y="330" width="260" height="120" fill="#eef2f7" stroke="#183153"/><text x="35" y="360" font-size="22" fill="#183153">DimProduct</text><text x="35" y="392" font-size="16" fill="#183153">ProductKey (unique)</text><text x="35" y="422" font-size="16" fill="#183153">Product / Category</text><rect x="670" y="330" width="260" height="120" fill="#eef2f7" stroke="#183153"/><text x="685" y="360" font-size="22" fill="#183153">DimRegion</text><text x="685" y="392" font-size="16" fill="#183153">RegionKey (unique)</text><text x="685" y="422" font-size="16" fill="#183153">Region</text><rect x="330" y="610" width="290" height="120" fill="#eef2f7" stroke="#183153"/><text x="345" y="640" font-size="22" fill="#183153">DimCustomer</text><text x="345" y="672" font-size="16" fill="#183153">CustomerKey (unique)</text><text x="345" y="702" font-size="16" fill="#183153">Segment</text><path d="M475,210 L475,300" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><text x="483.0" y="243.0" font-size="17" fill="#183153">1 → *</text><path d="M280,390 L330,390" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><text x="313.0" y="378.0" font-size="17" fill="#183153">1 → *</text><path d="M670,390 L620,390" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><text x="653.0" y="378.0" font-size="17" fill="#183153">1 → *</text><path d="M475,610 L475,520" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><text x="483.0" y="553.0" font-size="17" fill="#183153">1 → *</text><text x="30" y="795" font-size="17" fill="#183153">Single-direction filtering: dimension → fact. OrderID can repeat across lines.</text></g></svg>
