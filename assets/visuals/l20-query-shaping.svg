<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img" aria-labelledby="title desc"><title id="title">Power Query: shape before loading</title><desc id="desc">Conceptual workflow, not a fabricated Power BI screenshot. The lab supplies exact Desktop steps.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">Power Query: shape before loading</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Import and profile</text><text x="90" y="140" font-size="17" fill="#183153">Choose sales_multiyear.csv; set Date, key, numeric and currency types explicitly.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Merge: enrich rows by a key</text><text x="90" y="265" font-size="17" fill="#183153">Sales.ProductKey joins unique DimProduct.ProductKey; validate row counts.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Append: stack matching schemas</text><text x="90" y="390" font-size="17" fill="#183153">2022 rows + 2023 rows; preserve columns and check combined row count.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#183153">4. Unpivot: columns become observations</text><text x="90" y="515" font-size="17" fill="#183153">Region, Jan, Feb → Region, Month, Amount; write the new grain.</text><path d="M435,556 L435,583" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="585" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="613" font-size="20" font-weight="bold" fill="#0f766e">5. Load and verify</text><text x="90" y="640" font-size="17" fill="#183153">Compare totals. CSV sources do not support database query folding.</text><text x="40" y="790" font-size="16" fill="#183153">Conceptual workflow, not a fabricated Power BI screenshot. The lab supplies exact Desktop</text><text x="40" y="812" font-size="16" fill="#183153">steps.</text></g></svg>
