<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img" aria-labelledby="title desc"><title id="title">Measure performance; do not invent improvements</title><desc id="desc">Procedure, not fabricated benchmark results. Native Power BI measurements must be supplied by executing Desktop.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="40" y="50" font-size="27" font-weight="bold" fill="#183153">Measure performance; do not invent improvements</text><rect x="70" y="85" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="90" y="113" font-size="20" font-weight="bold" fill="#2563eb">1. Baseline</text><text x="90" y="140" font-size="17" fill="#183153">Record Performance Analyzer duration for the same visual and filter state.</text><path d="M435,181 L435,208" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="210" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="238" font-size="20" font-weight="bold" fill="#183153">2. Reduce unnecessary storage</text><text x="90" y="265" font-size="17" fill="#183153">Remove unused columns; retain relationship keys. Hiding only affects usability.</text><path d="M435,306 L435,333" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="335" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="363" font-size="20" font-weight="bold" fill="#183153">3. Simplify model and measures</text><text x="90" y="390" font-size="17" fill="#183153">Check cardinality, single-direction relationships, unnecessary iterators, and Auto</text><text x="90" y="412" font-size="17" fill="#183153">Date/Time.</text><path d="M435,431 L435,458" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="460" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="90" y="488" font-size="20" font-weight="bold" fill="#183153">4. Repeat controlled measurement</text><text x="90" y="515" font-size="17" fill="#183153">Use the same machine, query, refresh state, and repeated runs; separate cold/warm</text><text x="90" y="537" font-size="17" fill="#183153">effects.</text><path d="M435,556 L435,583" stroke="#183153" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="585" width="730" height="95" rx="10" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="90" y="613" font-size="20" font-weight="bold" fill="#0f766e">5. Report evidence</text><text x="90" y="640" font-size="17" fill="#183153">Compare durations and model size; a change may not improve speed.</text><text x="40" y="790" font-size="16" fill="#183153">Procedure, not fabricated benchmark results. Native Power BI measurements must be supplied</text><text x="40" y="812" font-size="16" fill="#183153">by executing Desktop.</text></g></svg>
