<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100"><title>Retail analytics pipeline</title><desc>Sources feed immutable raw storage, transformation and validation. Failed records go to review; curated facts and dimensions feed Power BI. Dashed connections denote operational support.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#183153"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#183153" font-weight="bold">Retail analytics pipeline</text><rect x="30" y="80" width="210" height="55" rx="8" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="135.0" y="108" text-anchor="middle" font-size="17" fill="#2563eb">Sales CSV</text><path d="M135,135 L375,175" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><rect x="270" y="80" width="210" height="55" rx="8" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="375.0" y="108" text-anchor="middle" font-size="17" fill="#2563eb">Customer database</text><path d="M375,135 L375,175" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="80" width="210" height="55" rx="8" fill="#f3f7fb" stroke="#2563eb" stroke-width="2"/><text x="615.0" y="108" text-anchor="middle" font-size="17" fill="#2563eb">Product API</text><path d="M615,135 L375,175" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><rect x="130" y="175" width="490" height="75" rx="8" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="375.0" y="203" text-anchor="middle" font-size="17" fill="#183153">Ingestion</text><rect x="130" y="275" width="490" height="75" rx="8" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="375.0" y="303" text-anchor="middle" font-size="17" fill="#183153">Immutable raw storage</text><rect x="130" y="375" width="490" height="75" rx="8" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="375.0" y="403" text-anchor="middle" font-size="17" fill="#183153">Transform and validate</text><rect x="130" y="555" width="490" height="75" rx="8" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="375.0" y="583" text-anchor="middle" font-size="17" fill="#0f766e">Curated FactSales</text><text x="375.0" y="606" text-anchor="middle" font-size="17" fill="#0f766e">Date / Product / Customer / Region</text><rect x="130" y="700" width="490" height="75" rx="8" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="375.0" y="728" text-anchor="middle" font-size="17" fill="#0f766e">Power BI semantic model</text><rect x="130" y="840" width="490" height="75" rx="8" fill="#f3f7fb" stroke="#0f766e" stroke-width="2"/><text x="375.0" y="868" text-anchor="middle" font-size="17" fill="#0f766e">Interactive report</text><path d="M375,250 L375,275" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><path d="M375,350 L375,375" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><path d="M375,450 L375,555" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><path d="M375,630 L375,700" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><path d="M375,775 L375,840" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><text x="390" y="505" font-size="18" fill="#0f766e">Pass</text><rect x="660" y="405" width="300" height="85" rx="8" fill="#f3f7fb" stroke="#b44444" stroke-width="2"/><text x="810.0" y="433" text-anchor="middle" font-size="17" fill="#b44444">Fail: quarantine</text><text x="810.0" y="456" text-anchor="middle" font-size="17" fill="#b44444">Review / correct records</text><path d="M620,415 L660,430" fill="none" stroke="#183153" stroke-width="2" marker-end="url(#arr)"/><path d="M810,405 L810,355 L620,405" stroke="#b44444" fill="none" stroke-width="2" marker-end="url(#arr)"/><rect x="680" y="650" width="270" height="125" rx="8" fill="#f3f7fb" stroke="#183153" stroke-width="2"/><text x="815.0" y="678" text-anchor="middle" font-size="17" fill="#183153">SUPPORT THROUGHOUT</text><text x="815.0" y="701" text-anchor="middle" font-size="17" fill="#183153">Orchestration / monitoring</text><text x="815.0" y="724" text-anchor="middle" font-size="17" fill="#183153">Access control / lineage</text><path d="M680,680 L620,590" fill="none" stroke="#183153" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><path d="M680,710 L620,750" fill="none" stroke="#183153" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="30" y="975" font-size="17" fill="#183153">Solid arrows: data flow / reprocessing. Dashed: support connections.</text><text x="30" y="1010" font-size="17" fill="#183153">Raw records stay unchanged; verified corrections enter a new processing version.</text><text x="30" y="1045" font-size="17" fill="#183153">FactSales grain: one order line. Supporting layers apply to every stage.</text></g></svg>
