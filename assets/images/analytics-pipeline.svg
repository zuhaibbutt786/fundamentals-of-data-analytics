<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="End-to-end analytics pipeline">
  <rect width="720" height="220" fill="#0b1120" rx="12"/>
  <text x="360" y="28" text-anchor="middle" fill="#f1f5f9" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700">End-to-End Analytics Pipeline</text>
  <g font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600">
    <rect x="20" y="70" width="110" height="70" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
    <text x="75" y="100" text-anchor="middle" fill="#93c5fd">Sources</text>
    <text x="75" y="118" text-anchor="middle" fill="#64748b" font-size="10" font-weight="400">CSV · DB · API</text>
    <rect x="160" y="70" width="110" height="70" rx="10" fill="#1e3a5f" stroke="#8b5cf6" stroke-width="2"/>
    <text x="215" y="100" text-anchor="middle" fill="#c4b5fd">Ingest</text>
    <text x="215" y="118" text-anchor="middle" fill="#64748b" font-size="10" font-weight="400">Power Query</text>
    <rect x="300" y="70" width="110" height="70" rx="10" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2"/>
    <text x="355" y="100" text-anchor="middle" fill="#67e8f9">Prepare</text>
    <text x="355" y="118" text-anchor="middle" fill="#64748b" font-size="10" font-weight="400">Clean · Transform</text>
    <rect x="440" y="70" width="110" height="70" rx="10" fill="#1e3a5f" stroke="#10b981" stroke-width="2"/>
    <text x="495" y="100" text-anchor="middle" fill="#6ee7b7">Model</text>
    <text x="495" y="118" text-anchor="middle" fill="#64748b" font-size="10" font-weight="400">Star · DAX</text>
    <rect x="580" y="70" width="120" height="70" rx="10" fill="#1e3a5f" stroke="#f59e0b" stroke-width="2"/>
    <text x="640" y="100" text-anchor="middle" fill="#fcd34d">Visualize</text>
    <text x="640" y="118" text-anchor="middle" fill="#64748b" font-size="10" font-weight="400">Dashboard · Story</text>
  </g>
  <text x="360" y="190" text-anchor="middle" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="11">Python / Pandas for prep · Power BI for model and delivery · Ethics at every stage</text>
</svg>
