<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Power BI architecture layers">
  <rect width="640" height="300" fill="#0b1120" rx="12"/>
  <text x="320" y="30" text-anchor="middle" fill="#f1f5f9" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700">Power BI Architecture Layers</text>
  <g font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600">
    <rect x="40" y="55" width="560" height="45" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="83" text-anchor="middle" fill="#93c5fd">Report View — visuals, bookmarks, storytelling</text>
    <rect x="40" y="115" width="560" height="45" rx="8" fill="#1e3a5f" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="143" text-anchor="middle" fill="#c4b5fd">Data Model — relationships, star schema, date table</text>
    <rect x="40" y="175" width="560" height="45" rx="8" fill="#1e3a5f" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="203" text-anchor="middle" fill="#6ee7b7">DAX Layer — measures, CALCULATE, time intelligence</text>
