<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" aria-label="MCAR MAR MNAR missing data types">
  <rect width="680" height="280" fill="#0b1120" rx="12"/>
  <text x="340" y="32" text-anchor="middle" fill="#f1f5f9" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700">Types of Missing Data</text>
  <g font-family="Inter,system-ui,sans-serif">
    <rect x="20" y="55" width="200" height="190" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="85" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="700">MCAR</text>
    <text x="120" y="108" text-anchor="middle" fill="#94a3b8" font-size="11">Missing Completely At Random</text>
    <text x="120" y="155" text-anchor="middle" fill="#cbd5e1" font-size="12">Unrelated to any variable</text>
    <text x="120" y="200" text-anchor="middle" fill="#64748b" font-size="11">→ Deletion often OK</text>
    <text x="120" y="218" text-anchor="middle" fill="#64748b" font-size="11">→ Simple impute OK</text>
    <rect x="240" y="55" width="200" height="190" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="340" y="85" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="700">MAR</text>
    <text x="340" y="108" text-anchor="middle" fill="#94a3b8" font-size="11">Missing At Random</text>
    <text x="340" y="155" text-anchor="middle" fill="#cbd5e1" font-size="12">Depends on observed vars</text>
    <text x="340" y="200" text-anchor="middle" fill="#64748b" font-size="11">→ Impute using predictors</text>
    <text x="340" y="218" text-anchor="middle" fill="#64748b" font-size="11">→ Deletion can bias</text>
    <rect x="460" y="55" width="200" height="190" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="560" y="85" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700">MNAR</text>
    <text x="560" y="108" text-anchor="middle" fill="#94a3b8" font-size="11">Missing Not At Random</text>
    <text x="560" y="155" text-anchor="middle" fill="#cbd5e1" font-size="12">Depends on missing value</text>
    <text x="560" y="200" text-anchor="middle" fill="#64748b" font-size="11">→ Domain model needed</text>
    <text x="560" y="218" text-anchor="middle" fill="#64748b" font-size="11">→ Sensitivity analysis</text>
  </g>
</svg>
